name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: dcc-bigfred/common/.github/workflows/rust-musl-ci.yml@v2
    with:
      binaries: '[{"name":"microdns","dist":"microdns-linux"}]'
      build_env: |
        MICRODNS_GIT_COMMIT=${{ github.sha }}
